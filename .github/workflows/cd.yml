name: Docker CD

on:
  workflow_run:
    workflows: ["Docker CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t number-guessing-game .

      - name: Tag Docker image
        run: |
          docker tag number-guessing-game:latest \
          459969247850.dkr.ecr.ap-south-1.amazonaws.com/number-guessing-game:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
          459969247850.dkr.ecr.ap-south-1.amazonaws.com/number-guessing-game:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 65.1.107.133
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | \
            sudo docker login --username AWS --password-stdin \
            459969247850.dkr.ecr.ap-south-1.amazonaws.com

            sudo docker pull \
            459969247850.dkr.ecr.ap-south-1.amazonaws.com/number-guessing-game:latest

            sudo docker stop number-guessing-game || true
            sudo docker rm number-guessing-game || true

            sudo docker run -d \
            --name number-guessing-game \
            -p 3000:3000 \
            459969247850.dkr.ecr.ap-south-1.amazonaws.com/number-guessing-game:latest
