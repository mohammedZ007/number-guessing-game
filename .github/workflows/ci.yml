name: Docker CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t number-guessing-game .

      - name: Run container test
        run: printf "1\n2\n3\n" | docker run -i --rm number-guessing-game
