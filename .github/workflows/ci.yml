name: Docker CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t number-guessing-game .

      - name: Run container
        run: |
          docker run -d --name number-guessing-game -p 3000:3000 number-guessing-game
          sleep 5

      - name: Test application
        run: curl --fail http://localhost:3000

      - name: Stop container
        if: always()
        run: docker rm -f number-guessing-game
